{% extends 'base.html' %}
{% block title %}Register | WishWellMap{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center mb-4">Start Your WishWell Journey</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-3">Create Account</button>
            </form>
            <div class="text-center mt-3">
                <small>Already registered? <a href="{% url 'login' %}">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
