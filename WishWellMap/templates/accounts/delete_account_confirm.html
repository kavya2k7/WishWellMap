{% extends 'base.html' %}

{% block title %}Delete Account | WishWellMap{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card border-danger shadow-sm">
        <div class="card-body text-center p-4">
            <h3 class="card-title text-danger fw-bold mb-3">⚠️ Delete Account</h3>
            <p class="text-muted mb-4">
                Warning: This action is permanent. All your saved wishes, goals, shelves, and memories will be erased immediately.
            </p>
            
            <form method="POST" action="{% url 'delete_account' %}">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete Account</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
