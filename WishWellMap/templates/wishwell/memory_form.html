{% extends 'base.html' %}
{% block title %}Add Memory | WishWellMap{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h3 class="mb-2">Capture Memory: {{ item.title }} 📸</h3>
            <p class="text-muted mb-4">Record your story, feelings, and upload photos from this experience.</p>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="mb-3">
                    <label class="form-label">Upload Photos (Multiple Supported):</label>
                    <input type="file" name="images" multiple class="form-control" accept="image/*">
                </div>
                <button type="submit" class="btn btn-success w-100 mt-3">Save Experience & Earn Points 🌊</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
